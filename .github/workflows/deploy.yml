name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Add CNAME
        run: echo www.joe-hahn.com > ./dist/CNAME

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
